<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7SS — Armillary Cognitive OS</title>
  <style>
    :root {
      --bg-void: #05060a;
      --panel-bg: rgba(13, 16, 26, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;

      /* 7SS Rainbow Spectrum */
      --c-red: #ff3b5c;
      --c-orange: #ff8c24;
      --c-yellow: #ffd60a;
      --c-green: #10b981;
      --c-blue: #38bdf8;
      --c-indigo: #6366f1;
      --c-violet: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    }

    body {
      background: radial-gradient(circle at 35% 50%, #0f1526 0%, var(--bg-void) 70%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
    }

    /* ================= LEFT: 3D ARMILLARY SPHERE ================= */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      user-select: none;
    }

    .hud-header {
      position: absolute;
      top: 28px;
      left: 32px;
      z-index: 20;
    }

    .hud-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--c-red), var(--c-yellow), var(--c-blue), var(--c-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .armillary-container {
      position: relative;
      width: 480px;
      height: 480px;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phase 1: Central Red Core */
    .core-sphere {
      position: absolute;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #ff8fa3, var(--c-red) 55%, #7f0920 100%);
      box-shadow: 0 0 35px rgba(255, 59, 92, 0.75), inset 0 0 16px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      animation: corePulse 3s infinite ease-in-out;
    }

    .core-sphere:hover {
      transform: scale(1.12);
      box-shadow: 0 0 55px rgba(255, 59, 92, 1), inset 0 0 20px rgba(255, 255, 255, 0.7);
    }

    .core-sphere.processing {
      animation: coreSpinProcessing 0.9s infinite linear;
    }

    @keyframes corePulse {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 59, 92, 0.65); }
      50% { box-shadow: 0 0 52px rgba(255, 59, 92, 0.95); }
    }

    @keyframes coreSpinProcessing {
      0% { transform: scale(1.05); filter: brightness(1.1); }
      50% { transform: scale(1.18); filter: brightness(1.45); }
      100% { transform: scale(1.05); filter: brightness(1.1); }
    }

    /* Orbital Rings (Phases 2-7) */
    .ring-wrapper {
      position: absolute;
      border-radius: 50%;
      transform-style: preserve-3d;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--ring-color);
      box-shadow: 0 0 16px var(--ring-glow), inset 0 0 12px var(--ring-glow);
      transition: all 0.5s ease;
      position: relative;
    }

    /* Locked State: Visible structure, dimmed, non-interactive */
    .ring-wrapper.locked .ring {
      opacity: 0.22;
      filter: grayscale(0.65);
      box-shadow: none;
      border-width: 2px;
      pointer-events: none;
    }

    /* Unlocked / Active State: Glowing, clickable */
    .ring-wrapper.unlocked .ring {
      opacity: 0.92;
      filter: grayscale(0);
      pointer-events: auto;
      cursor: pointer;
    }

    .ring-wrapper.unlocked .ring:hover {
      border-width: 5px;
      box-shadow: 0 0 32px var(--ring-color), inset 0 0 22px var(--ring-color);
    }

    .ring-wrapper.completed .ring {
      opacity: 1;
      border-width: 3.5px;
      pointer-events: auto;
      cursor: pointer;
    }

    .ring-wrapper.processing .ring {
      border-style: dashed;
      border-width: 4px;
      box-shadow: 0 0 38px var(--ring-color);
    }

    /* Orbital Node Marker on each ring */
    .ring-node {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ring-color);
      box-shadow: 0 0 12px var(--ring-color);
    }

    /* Individual Gyroscopic Tilts & Rotations */
    /* Phase 2: Orange */
    .w-2 {
      width: 155px; height: 155px;
      --ring-color: var(--c-orange);
      --ring-glow: rgba(255, 140, 36, 0.45);
      animation: orbit2 14s linear infinite;
    }
    /* Phase 3: Yellow */
    .w-3 {
      width: 215px; height: 215px;
      --ring-color: var(--c-yellow);
      --ring-glow: rgba(255, 214, 10, 0.4);
      animation: orbit3 19s linear infinite;
    }
    /* Phase 4: Green */
    .w-4 {
      width: 275px; height: 275px;
      --ring-color: var(--c-green);
      --ring-glow: rgba(16, 185, 129, 0.4);
      animation: orbit4 24s linear infinite;
    }
    /* Phase 5: Blue */
    .w-5 {
      width: 335px; height: 335px;
      --ring-color: var(--c-blue);
      --ring-glow: rgba(56, 189, 248, 0.4);
      animation: orbit5 29s linear infinite;
    }
    /* Phase 6: Indigo */
    .w-6 {
      width: 395px; height: 395px;
      --ring-color: var(--c-indigo);
      --ring-glow: rgba(99, 102, 241, 0.4);
      animation: orbit6 35s linear infinite;
    }
    /* Phase 7: Violet */
    .w-7 {
      width: 455px; height: 455px;
      --ring-color: var(--c-violet);
      --ring-glow: rgba(192, 132, 252, 0.45);
      animation: orbit7 42s linear infinite;
    }

    @keyframes orbit2 {
      0% { transform: rotateX(68deg) rotateY(18deg) rotateZ(0deg); }
      100% { transform: rotateX(68deg) rotateY(18deg) rotateZ(360deg); }
    }
    @keyframes orbit3 {
      0% { transform: rotateX(55deg) rotateY(-42deg) rotateZ(0deg); }
      100% { transform: rotateX(55deg) rotateY(-42deg) rotateZ(-360deg); }
    }
    @keyframes orbit4 {
      0% { transform: rotateX(-64deg) rotateY(30deg) rotateZ(0deg); }
      100% { transform: rotateX(-64deg) rotateY(30deg) rotateZ(360deg); }
    }
    @keyframes orbit5 {
      0% { transform: rotateX(35deg) rotateY(65deg) rotateZ(0deg); }
      100% { transform: rotateX(35deg) rotateY(65deg) rotateZ(-360deg); }
    }
    @keyframes orbit6 {
      0% { transform: rotateX(-48deg) rotateY(-55deg) rotateZ(0deg); }
      100% { transform: rotateX(-48deg) rotateY(-55deg) rotateZ(360deg); }
    }
    @keyframes orbit7 {
      0% { transform: rotateX(75deg) rotateY(-12deg) rotateZ(0deg); }
      100% { transform: rotateX(75deg) rotateY(-12deg) rotateZ(-360deg); }
    }

    /* Legend Pills at Bottom Left */
    .phase-pills {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
      z-index: 20;
    }

    .pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .pill.unlocked {
      color: #fff;
      border-color: var(--pill-c);
      box-shadow: 0 0 12px var(--pill-c);
      cursor: pointer;
    }

    .pill.completed {
      background: var(--pill-c);
      color: #05060a;
      font-weight: 700;
      cursor: pointer;
    }

    /* ================= RIGHT: COMMAND & TELEMETRY PANEL ================= */
    .console {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 28px;
      gap: 18px;
    }

    .console-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
    }

    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--c-red);
      box-shadow: 0 0 10px var(--c-red);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-reset:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 105px;
      background: rgba(5, 6, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1.45;
      resize: none;
      outline: none;
      transition: border-color 0.25s;
    }

    textarea:focus {
      border-color: var(--c-red);
    }

    .btn-execute {
      background: linear-gradient(135deg, var(--c-red), #d91b42);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 59, 92, 0.35);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    }

    .btn-execute:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(255, 59, 92, 0.55);
    }

    .btn-execute:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .telemetry-stream {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .telemetry-card {
      background: rgba(5, 6, 10, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--card-c);
      border-radius: 8px;
      padding: 14px;
      animation: fadeSlide 0.35s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--card-c);
    }

    .card-body {
      font-size: 0.86rem;
      line-height: 1.55;
      color: #e2e8f0;
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.84rem;
      margin-top: 40px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- LEFT STAGE: 3D ARMILLARY SPHERE -->
  <div class="stage">
    <div class="hud-header">
      <h1>7SS Armillary Engine</h1>
      <p id="instructionText">Click the Red Core to ignite Phase 1 (Intent)</p>
    </div>

    <div class="armillary-container">
      <!-- Outer-to-Inner Orbital Rings (Phases 7 down to 2) -->
      <div class="ring-wrapper w-7 locked" id="ring-7" onclick="selectPhase(7)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>
      <div class="ring-wrapper w-6 locked" id="ring-6" onclick="selectPhase(6)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>
      <div class="ring-wrapper w-5 locked" id="ring-5" onclick="selectPhase(5)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>
      <div class="ring-wrapper w-4 locked" id="ring-4" onclick="selectPhase(4)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>
      <div class="ring-wrapper w-3 locked" id="ring-3" onclick="selectPhase(3)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>
      <div class="ring-wrapper w-2 locked" id="ring-2" onclick="selectPhase(2)">
        <div class="ring"><div class="ring-node"></div></div>
      </div>

      <!-- Phase 1: Central Red Core -->
      <div class="core-sphere" id="ring-1" onclick="selectPhase(1)">
        CORE
      </div>
    </div>

    <!-- Bottom Spectrum Legend -->
    <div class="phase-pills">
      <div class="pill unlocked" id="pill-1" style="--pill-c: var(--c-red)" onclick="selectPhase(1)">1. Red Core</div>
      <div class="pill" id="pill-2" style="--pill-c: var(--c-orange)" onclick="selectPhase(2)">2. Orange</div>
      <div class="pill" id="pill-3" style="--pill-c: var(--c-yellow)" onclick="selectPhase(3)">3. Yellow</div>
      <div class="pill" id="pill-4" style="--pill-c: var(--c-green)" onclick="selectPhase(4)">4. Green</div>
      <div class="pill" id="pill-5" style="--pill-c: var(--c-blue)" onclick="selectPhase(5)">5. Blue</div>
      <div class="pill" id="pill-6" style="--pill-c: var(--c-indigo)" onclick="selectPhase(6)">6. Indigo</div>
      <div class="pill" id="pill-7" style="--pill-c: var(--c-violet)" onclick="selectPhase(7)">7. Violet</div>
    </div>
  </div>

  <!-- RIGHT CONSOLE: TELEMETRY & EXECUTION -->
  <div class="console">
    <div class="console-top">
      <div class="active-badge" id="activeBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="activeTitle">Phase 1: Red Core (Intent)</span>
      </div>
      <div class="controls-row">
        <label class="toggle-label" title="Automatically chain through all 7 rings once Red Core fires">
          <input type="checkbox" id="autoCascade" />
          Auto-Cascade
        </label>
        <button class="btn-reset" onclick="resetSphere()">Reset</button>
      </div>
    </div>

    <div class="input-group">
      <label id="promptLabel">Raw Core Objective / Seed Directive</label>
      <textarea id="promptInput" placeholder="Enter your high-level objective here, then click the Red Core or Execute..."></textarea>
      <button class="btn-execute" id="execBtn" onclick="executeActivePhase()">Ignite Red Core (Phase 1)</button>
    </div>

    <div class="telemetry-stream" id="telemetryStream">
      <div class="empty-state" id="emptyState">
        System locked in initial state.<br/>
        Only the <strong>Red Core</strong> is active. Click the core or hit Ignite to begin expanding the sphere outward.
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000/api";

    const PHASES = {
      1: { name: "Phase 1: Red Core (Intent)", endpoint: "/intent", color: "#ff3b5c", btnText: "Ignite Red Core (Phase 1)" },
      2: { name: "Phase 2: Orange (Decomposer)", endpoint: "/decompose", color: "#ff8c24", btnText: "Pulse Orange Ring (Phase 2)" },
      3: { name: "Phase 3: Yellow (Foresight)", endpoint: "/foresight", color: "#ffd60a", btnText: "Pulse Yellow Ring (Phase 3)" },
      4: { name: "Phase 4: Green (Transformation)", endpoint: "/transform", color: "#10b981", btnText: "Pulse Green Ring (Phase 4)" },
      5: { name: "Phase 5: Blue (Directives)", endpoint: "/directives", color: "#38bdf8", btnText: "Pulse Blue Ring (Phase 5)" },
      6: { name: "Phase 6: Indigo (Assembly)", endpoint: "/assemble", color: "#6366f1", btnText: "Pulse Indigo Ring (Phase 6)" },
      7: { name: "Phase 7: Violet (Dispatch)", endpoint: "/dispatch", color: "#c084fc", btnText: "Fire Violet Horizon (Phase 7)" }
    };

    let unlockedMax = 1;
    let selectedPhase = 1;
    let phaseOutputs = {};
    let isRunning = false;

    function selectPhase(phaseNum) {
      if (isRunning) return;
      if (phaseNum > unlockedMax) return; // Strictly locked until prior phase completes

      selectedPhase = phaseNum;
      const cfg = PHASES[phaseNum];

      // Update header badge & button styling
      document.getElementById("activeTitle").innerText = cfg.name;
      const dot = document.getElementById("statusDot");
      dot.style.background = cfg.color;
      dot.style.boxShadow = `0 0 10px ${cfg.color}`;

      const btn = document.getElementById("execBtn");
      btn.innerText = cfg.btnText;
      btn.style.background = cfg.color;
      btn.style.color = (phaseNum === 3) ? "#05060a" : "#ffffff";
      btn.style.boxShadow = `0 4px 20px ${cfg.color}55`;

      const textarea = document.getElementById("promptInput");
      textarea.style.borderColor = cfg.color;

      // Auto-populate input with previous phase's output if moving forward
      if (phaseNum > 1 && phaseOutputs[phaseNum - 1] && !phaseOutputs[phaseNum]) {
        textarea.value = phaseOutputs[phaseNum - 1];
        document.getElementById("promptLabel").innerText = `Handoff Payload from Phase ${phaseNum - 1} (Editable)`;
      } else if (phaseNum === 1) {
        document.getElementById("promptLabel").innerText = "Raw Core Objective / Seed Directive";
      }
    }

    async function executeActivePhase() {
      if (isRunning) return;
      const promptVal = document.getElementById("promptInput").value.trim();
      if (!promptVal) {
        alert("Enter a directive in the console first.");
        return;
      }

      isRunning = true;
      const current = selectedPhase;
      const cfg = PHASES[current];
      const ringEl = document.getElementById(`ring-${current}`);
      const btn = document.getElementById("execBtn");

      ringEl.classList.add("processing");
      btn.disabled = true;
      btn.innerText = `Processing ${cfg.name}...`;
      document.getElementById("instructionText").innerText = `Executing ${cfg.name} via Local Ollama...`;

      try {
        const res = await fetch(`${API_BASE}${cfg.endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptVal })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const outputText = data.response || JSON.stringify(data, null, 2);

        phaseOutputs[current] = outputText;
        renderTelemetryCard(current, cfg, outputText);

        // Mark current ring completed
        ringEl.classList.remove("processing");
        ringEl.classList.add("completed");
        document.getElementById(`pill-${current}`).classList.add("completed");

        // Unlock next ring outward if available
        if (current < 7) {
          unlockedMax = Math.max(unlockedMax, current + 1);
          const nextRing = document.getElementById(`ring-${current + 1}`);
          nextRing.classList.remove("locked");
          nextRing.classList.add("unlocked");
          document.getElementById(`pill-${current + 1}`).classList.add("unlocked");

          isRunning = false;
          selectPhase(current + 1);
          document.getElementById("instructionText").innerText = `Ring ${current + 1} Unlocked! Click the glowing ring or press Pulse.`;

          // If Auto-Cascade is checked, automatically fire the next ring
          if (document.getElementById("autoCascade").checked) {
            await executeActivePhase();
            return;
          }
        } else {
          document.getElementById("instructionText").innerText = "Full 7SS Armillary Spectrum Synchronized.";
        }
      } catch (err) {
        console.error(err);
        ringEl.classList.remove("processing");
        alert(`Bridge Error on ${cfg.name}: ${err.message}. Ensure bridge.py is running on port 8000.`);
      } finally {
        isRunning = false;
        btn.disabled = false;
        btn.innerText = PHASES[selectedPhase].btnText;
      }
    }

    function renderTelemetryCard(phaseNum, cfg, text) {
      const empty = document.getElementById("emptyState");
      if (empty) empty.remove();

      const stream = document.getElementById("telemetryStream");
      const existing = document.getElementById(`card-${phaseNum}`);
      if (existing) existing.remove();

      const card = document.createElement("div");
      card.className = "telemetry-card";
      card.id = `card-${phaseNum}`;
      card.style.setProperty("--card-c", cfg.color);

      card.innerHTML = `
        <div class="card-header">
          <span>${cfg.name}</span>
          <span>✓ LOCKED IN</span>
        </div>
        <div class="card-body">${escapeHtml(text)}</div>
      `;

      stream.appendChild(card);
      stream.scrollTop = stream.scrollHeight;
    }

    function resetSphere() {
      if (isRunning) return;
      unlockedMax = 1;
      phaseOutputs = {};

      for (let i = 2; i <= 7; i++) {
        const r = document.getElementById(`ring-${i}`);
        r.className = `ring-wrapper w-${i} locked`;
        const p = document.getElementById(`pill-${i}`);
        p.className = "pill";
      }
      document.getElementById("ring-1").className = "core-sphere";
      document.getElementById("pill-1").className = "pill unlocked";

      document.getElementById("promptInput").value = "";
      document.getElementById("telemetryStream").innerHTML = `
        <div class="empty-state" id="emptyState">
          System locked in initial state.<br/>
          Only the <strong>Red Core</strong> is active. Click the core or hit Ignite to begin expanding the sphere outward.
        </div>
      `;
      document.getElementById("instructionText").innerText = "Click the Red Core to ignite Phase 1 (Intent)";
      selectPhase(1);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
